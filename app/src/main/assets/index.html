<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MyDay</title>
<style>
:root{
  --bg:#F6F3EB; --card:#FFFFFF; --ink:#292420; --muted:#8A8174; --line:rgba(30,20,0,.10);
  --accent:#D97706; --accent-soft:#F4E3C8; --danger:#C0392B;
  --radius:16px; --shadow:0 1px 3px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.05);
}
[data-theme="dark"]{
  --bg:#14110C; --card:#201B13; --ink:#EDE5D6; --muted:#9A8F7C; --line:rgba(255,255,255,.09);
  --accent:#F5A623; --accent-soft:#3A2E17; --danger:#E06B5A;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;
  transition:background .25s,color .25s;
}
header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;
  padding:10px 12px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
}
.brand{font-weight:800;font-size:19px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex:1;white-space:nowrap;cursor:pointer;user-select:none}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.viewtabs{display:flex;gap:2px;background:var(--accent-soft);border-radius:10px;padding:2px;flex:0 0 auto}
.viewtab{border:none;background:transparent;color:var(--ink);font-size:14px;font-weight:600;width:34px;height:30px;border-radius:8px;cursor:pointer}
.viewtab.on{background:var(--accent);color:#fff}
.icobtn{width:38px;height:38px;min-width:38px;border:none;border-radius:12px;background:transparent;color:var(--ink);
  font-size:19px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
.icobtn:active{background:var(--accent-soft)}
main{max-width:700px;margin:0 auto;padding:8px 14px 110px}
.day{margin:30px 0}
.day:first-child{margin-top:14px}
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dlabel{font-size:21px;font-weight:700;font-family:Georgia,"Times New Roman",serif;letter-spacing:.3px}
.dsub{font-size:13px;color:var(--muted)}
.spacer{flex:1}
.dayhead .icobtn{font-size:16px;width:32px;height:32px;min-width:32px}
.dtext{font-size:16px;overflow-wrap:break-word;margin-bottom:10px}
.dimgs{display:grid;grid-template-columns:1fr;gap:10px}
.timg{width:100%;height:auto;border-radius:12px;display:block;background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;padding-top:10px}
.grp{margin:0 0 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.grphead{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:transparent;border:none;cursor:pointer;color:var(--ink);text-align:left}
.grphead:active{background:var(--accent-soft)}
.gthumbs{display:flex;gap:4px;flex:0 0 auto}
.gthumb{width:34px;height:34px;border-radius:8px;overflow:hidden;background:var(--accent-soft)}
.gthumb img{width:100%;height:100%;object-fit:cover;display:block}
.gtitle{font-size:16px;font-weight:700;white-space:nowrap}
.gsub{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap;flex:0 0 auto}
.gchev{color:var(--muted);font-size:13px;width:14px;text-align:center;flex:0 0 auto}
.grpbody{border-top:1px solid var(--line);padding:2px 10px 12px}
.grpbody .grid{margin-top:4px;padding-top:4px}
.grpsub{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:none;background:transparent;cursor:pointer;color:var(--ink);text-align:left;border-top:1px solid var(--line)}
.grpsub:active{background:var(--accent-soft)}
.grpmbody{border-top:1px solid var(--line);padding:2px 10px 12px}
.grpmbody .grid{margin-top:4px;padding-top:4px}
.entry{margin:0 0 14px}
.entrymeta{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.entrymeta .icobtn{font-size:14px;width:28px;height:28px;min-width:28px}
.grpsum{display:flex;align-items:center;gap:10px;padding:9px 14px 10px;color:var(--muted);font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line);cursor:pointer}
.grpsum:active{background:var(--accent-soft)}
.gpsumimg{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--accent-soft)}
.grpsum span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:active{background:var(--accent-soft)}
.rowthumb{flex:0 0 auto}
.rowthumb img{width:52px;height:52px;border-radius:10px;object-fit:cover;display:block;background:var(--accent-soft)}
.rowtxt{flex:1;font-size:14px;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;min-width:0}
.dayadd{width:100%;margin-top:8px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.dayadd:active{background:var(--accent-soft)}
.monthwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:10px 12px 12px;align-items:start}
.mwall{background:var(--bg-soft);border-radius:14px;padding:12px}
.mwallhead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.mwalltitle{font-weight:800;font-size:17px}
.mwallmeta{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.mwalldays{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.mdaybadge{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.mwallimgs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.mwallimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:var(--accent-soft);cursor:pointer}
.mwalltexts{margin-top:10px}
.mtext{font-size:12.5px;color:var(--muted);line-height:1.6;padding:3px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;cursor:pointer}
.mtext:active{color:var(--ink)}
.mtextdate{font-weight:600;color:var(--ink);font-size:12px}
.mwallfoot{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.mwallbtn{width:100%;border:none;background:var(--accent);color:#fff;font-weight:700;padding:8px;border-radius:10px;font-size:13.5px;cursor:pointer}
.mwallbtn:active{opacity:.85}
.filterbar{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:10px;padding:8px 14px;margin-bottom:10px;color:var(--accent);font-weight:600;font-size:13.5px}
.filterx{border:none;background:transparent;color:inherit;font-size:14px;cursor:pointer;padding:0;margin-left:auto}
.filterx:active{opacity:.6}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .1s}
.card:active{transform:scale(.97)}
.cardimg{height:120px;overflow:hidden;background:var(--accent-soft)}
.cardimg img{width:100%;height:100%;object-fit:cover;display:block}
.cardimg.cardph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;background:linear-gradient(135deg,var(--accent-soft),var(--card))}
.cardbody{padding:10px 12px 12px}
.carddate{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:3px}
.cardtext{font-size:13px;color:var(--muted);line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.card .del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:none;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2}
#editor{position:fixed;inset:0;background:var(--bg);z-index:40;display:none}
#editor.open{display:flex;flex-direction:column}
.edwrap{width:100%;max-width:700px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.edbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.edbar input[type=date]{flex:1;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:none}
.savebtn{border:none;background:var(--accent);color:#fff;font-weight:700;padding:9px 18px;border-radius:12px;font-size:15px;cursor:pointer;min-width:64px}
.timebtn{border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:600;padding:9px 14px;border-radius:12px;font-size:14px;cursor:pointer;flex:0 0 auto}
#edText{flex:1;margin:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);
  font-size:17px;line-height:1.8;resize:none;outline:none;min-height:150px}
.imgstrip{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}
.imgstrip::-webkit-scrollbar{display:none}
.ethumb{position:relative;flex:0 0 88px;height:88px;border-radius:10px;overflow:hidden;background:var(--accent-soft)}
.ethumb img{width:100%;height:100%;object-fit:cover}
.ethumb i{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
.addimg{flex:0 0 88px;height:88px;border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sheetwrap{background:var(--card);width:100%;max-width:700px;border-radius:22px 22px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2)}
.sheetbtn{display:block;width:100%;text-align:left;padding:13px 12px;border:none;background:transparent;border-radius:12px;cursor:pointer}
.sheetbtn:active{background:var(--accent-soft)}
.sheetbtn span{display:block;font-size:16px;color:var(--ink);font-weight:600}
.sheetbtn small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.sheetbtn.danger span{color:var(--danger)}
.sheetbtn:disabled{opacity:.45;cursor:not-allowed}
.sheetbtn:disabled:active{background:transparent}
.sheethead{font-size:16px;font-weight:700;color:var(--ink);padding:10px 12px 4px}
.sheetnote{font-size:13.5px;color:var(--muted);padding:2px 12px 12px;line-height:1.6}
.sheetinput{display:block;width:calc(100% - 24px);margin:0 12px 10px;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
#toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(20px);background:#2A241C;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:84vw;text-align:center}
[data-theme="dark"] #toast{background:#4A4236}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:none;align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .18s}
#lightbox img.zoomed{transform:scale(2.2)}
#viewer{position:fixed;inset:0;background:var(--bg);z-index:45;display:none}
#viewer.open{display:flex;flex-direction:column}
.vwrap{width:100%;max-width:700px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.vbar .vt{font-size:16px;font-weight:700;white-space:nowrap}
.vbar .vsub{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.vscroll{flex:1;overflow-y:auto;padding:16px 16px 48px}
.vtext{font-size:16.5px;line-height:1.9;overflow-wrap:break-word;margin-bottom:14px}
.vimgs{display:grid;grid-template-columns:1fr;gap:12px}
.vimgs img{width:100%;height:auto;border-radius:12px;display:block;background:var(--accent-soft)}
.dtext{cursor:pointer}
.empty{padding:90px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:56px;margin-bottom:16px}
.empty .sub{font-size:13px;margin-top:8px;color:var(--muted)}
#footer{text-align:center;color:var(--muted);font-size:12.5px;padding:22px 0 6px}
.browser .needapp{display:none}
@media (max-width:360px){
  .brand{font-size:17px}
  .icobtn{width:34px;height:34px;min-width:34px}
}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="goDefaultView()" title="回到流水视图"><span class="dot"></span>MyDay</div>
  <div class="viewtabs" id="viewTabs">
    <button class="viewtab" data-view="timeline" onclick="setView('timeline')">流</button>
    <button class="viewtab" data-view="day" onclick="setView('day')">日</button>
    <button class="viewtab" data-view="month" onclick="setView('month')">月</button>
    <button class="viewtab" data-view="year" onclick="setView('year')">年</button>
  </div>
  <button class="icobtn needapp" id="btnNew" onclick="newEntry()" title="写日记">＋</button>
  <button class="icobtn" id="btnMenu" onclick="menuMenu()" title="菜单">⋯</button>
</header>

<main id="list"></main>
<div id="footer"></div>

<div id="editor">
  <div class="edwrap">
    <div class="edbar">
      <button class="icobtn" onclick="closeEditor()" title="返回">✕</button>
      <input type="date" id="edDate">
      <button class="timebtn" onclick="insertTime()" title="在当前光标处插入当前时间">时间</button>
      <button class="savebtn" onclick="saveEntry()">保存</button>
    </div>
    <textarea id="edText" placeholder="记录今天的日常、心情、孩子们的趣事……"></textarea>
    <div class="imgstrip" id="edImgs"></div>
  </div>
</div>

<div id="viewer"></div>

<div id="lightbox" onclick="lbClick(event)"></div>

<div id="sheet"></div>
<div id="toast"></div>

<input type="file" id="fileInput" accept="image/*" multiple hidden>

<script>window.__MYDAY_EXPORT_DATA__=null;/*DATA*/</script>

<script>
'use strict';
var IS_APP = !!(window.Android && typeof window.Android.getAllEntries === 'function');
var EMBEDDED = (typeof window.__MYDAY_EXPORT_DATA__ !== 'undefined' && window.__MYDAY_EXPORT_DATA__) || null;

function el(id){ return document.getElementById(id); }

var entries = [];
var view = 'timeline';
var monthFilter = '';
var expanded = new Set();
var theme = 'light';
var editingId = null;
var editingImages = [];
var pendingImages = [];
var editorDirty = false;
var dateAutoSet = false;
var autoDateDone = false;
var lbLast = 0;

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseDate(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function weekdayCn(d){ return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; }
function formatDayLabel(s){
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var d = parseDate(s);
  var diff = Math.round((today - d) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff === 2) return '前天';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function imgSrc(name){ return IS_APP ? ('img://' + name) : ('images/' + name); }
function thumbSrc(name){ return IS_APP ? imgSrc(name.replace(/(\.\w{1,5})$/, '_t$1')) : imgSrc(name); }
function thumbImgTag(name, cls, onclick){
  var fb = IS_APP ? ' onerror="this.onerror=null;this.src=\'' + imgSrc(name) + '\'"' : '';
  var oc = onclick ? ' onclick="' + onclick + '"' : '';
  return '<img class="' + cls + '" src="' + thumbSrc(name) + '" alt="" loading="lazy"' + fb + oc + '>';
}
function summaryLines(text){
  var lines = String(text).split('\n').map(function(l){ return l.trim(); }).filter(Boolean).slice(0, 2);
  var s = lines.join(' ');
  return s.length > 80 ? s.slice(0, 80) + '…' : s;
}
function fmtBytes(b){
  if (!b) return '0 KB';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function normalizeEntry(raw){
  if (!raw || typeof raw !== 'object') return null;
  var rand = function(){ return Math.random().toString(36).slice(2, 6); };
  var now = Date.now();
  var e = {};
  var k, i;
  for (k in raw) { if (Object.prototype.hasOwnProperty.call(raw, k)) e[k] = raw[k]; }
  e.v = (typeof raw.v === 'number') ? raw.v : 0;
  if (typeof raw.id !== 'string' || !raw.id) e.id = 'e' + now + '_' + rand();
  if (typeof raw.date !== 'string') e.date = '';
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(raw.date)) e.date = '';
  if (typeof raw.text !== 'string') e.text = (raw.text == null) ? '' : String(raw.text);
  e.images = Array.isArray(raw.images) ? raw.images.filter(function(n){ return typeof n === 'string'; }) : [];
  if (typeof raw.time !== 'string') e.time = '';
  if (typeof raw.created !== 'number' || !isFinite(raw.created)) {
    e.created = (raw.created && isFinite(+raw.created)) ? +raw.created : 0;
  }
  return e;
}
function loadEntries(){
  var list = [];
  if (IS_APP) {
    try { list = JSON.parse(window.Android.getAllEntries()) || []; } catch(e) { list = []; }
  } else if (EMBEDDED) {
    list = EMBEDDED.slice();
  }
  entries = list.map(normalizeEntry).filter(Boolean).filter(function(e){ return /^\d{4}-\d{2}-\d{2}$/.test(e.date); });
  entries.sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (a.created || 0) - (b.created || 0);
  });
}
function groupByDate(){
  return groupEntries(entries);
}

function emptyHtml(){
  return '<div class="empty"><div class="big">🌤</div><div>还没有日记</div>' +
    (IS_APP ? '<div class="sub">点击右上角 ＋ 开始记录今天</div>' : '<div class="sub">这是 MyDay 的网页导出，仅供浏览</div>') + '</div>';
}

function entryBlockHtml(en){
  var textHtml = escapeHtml(en.text).replace(/\n/g, '<br>');
  var imgs = '';
  for (var i = 0; i < en.images.length; i++) {
    imgs += thumbImgTag(en.images[i], 'timg', 'openLightbox(\'' + en.images[i] + '\')');
  }
  return '<div class="entry" data-id="' + en.id + '">' +
    '<div class="entrymeta">' +
      '<span class="spacer"></span>' +
      '<button class="icobtn needapp" onclick="openEditorById(\'' + en.id + '\')" title="编辑">✎</button>' +
      '<button class="icobtn needapp" onclick="deleteEntryById(\'' + en.id + '\')" title="删除">🗑</button>' +
    '</div>' +
    (en.text ? '<div class="dtext" onclick="openViewer(\'' + en.id + '\')">' + textHtml + '</div>' : '') +
    (imgs ? '<div class="dimgs">' + imgs + '</div>' : '') +
  '</div>';
}
function dayHeadHtml(g){
  return '<div class="dayhead">' +
    '<span class="dlabel">' + formatDayLabel(g.date) + '</span>' +
    '<span class="dsub">' + g.date + ' · ' + weekdayCn(parseDate(g.date)) + (g.list.length > 1 ? ' · ' + g.list.length + ' 条' : '') + '</span>' +
    '<span class="spacer"></span>' +
    '<button class="icobtn needapp" onclick="newEntryForDate(\'' + g.date + '\')" title="再加一条">＋</button>' +
    '<button class="icobtn needapp" onclick="deleteDay(\'' + g.date + '\')" title="删除这一天">🗑</button>' +
  '</div>';
}
function streamHtml(dayGroups){
  var html = '';
  for (var i = 0; i < dayGroups.length; i++) {
    var g = dayGroups[i];
    html += '<article class="day" data-date="' + g.date + '">' + dayHeadHtml(g);
    for (var j = 0; j < g.list.length; j++) html += entryBlockHtml(g.list[j]);
    html += '</article>';
  }
  return html;
}
function renderTimeline(){
  var main = el('list');
  var filtered = entries;

function padYear(n){ return n < 10 ? '0' + n : '' + n; }
function normExifDate(s){
  var m = /(\d{4})[:.-](\d{1,2})[:.-](\d{1,2})/.exec(s || '');
  if (!m) return null;
  var y = parseInt(m[1], 10), mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
  if (y >= 2000 && y <= 2100 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return y + '-' + padYear(mo) + '-' + padYear(d);
  return null;
}

  if (!name) return null;
  var base = String(name).replace(/.*[\\/]/, '').replace(/\.\w{1,5}$/, '');
  var m = /(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/.exec(base);
  if (!m) return null;
  var y = parseInt(m[1], 10), mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
  if (y >= 2000 && y <= 2100 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return y + '-' + padYear(mo) + '-' + padYear(d);
  return null;
}
function parseExifDate(bytes){

function scanExif(bytes){

      if (segLen >= 10 && i + 2 + segLen <= len &&
          bytes[i + 4] === 0x45 && bytes[i + 5] === 0x78 && bytes[i + 6] === 0x69 &&
          bytes[i + 7] === 0x66 && bytes[i + 8] === 0x00 && bytes[i + 9] === 0x00) {
        return parseTiffExif(bytes, i + 10, i + 2 + segLen);
      }
      i += 2 + segLen;
    } else if (bytes[i] === 0xFF && bytes[i + 1] === 0xD8) {
      i += 2;
    } else if (bytes[i] === 0xFF && bytes[i + 1] >= 0xD0 && bytes[i + 1] <= 0xD7) {
      i += 2;
    } else if (bytes[i] === 0xFF && bytes[i + 1] === 0xFF) {
      i += 1;
    } else if (bytes[i] === 0xFF) {

function parseTiffExif(bytes, start, end){

  function u16(o){ return little ? ((bytes[o] & 0xFF) | ((bytes[o + 1] & 0xFF) << 8)) : (((bytes[o] & 0xFF) << 8) | (bytes[o + 1] & 0xFF)); }

  var out = { date: null };
  function pick(dt){
    if (!dt) return;
    var nd = normExifDate(dt);

  var ifd0 = start + u32(start + 4);
  if (ifd0 < start || ifd0 + 2 > end) return null;
  var n = u16(ifd0);

  if (exifPtr >= 0) {
    var exifIfd = start + exifPtr;
    if (exifIfd >= start && exifIfd + 2 <= end) {

      for (var k = 0; k < m; k++) {
        var en = exifIfd + 2 + k * 12;
        if (en + 12 > end) break;
        var tg = u16(en), ty = u16(en + 2), ct = u32(en + 4);

}
function parseExifDateFromDataUrl(dataUrl){
  var m = /^data:image\/(?:jpeg|jpg);base64,/.exec(dataUrl);

    var bin = atob(dataUrl.split(',')[1]);

function compressImage(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read')); };
    reader.onload = function(){
      var exifDate = parseExifDateFromDataUrl(reader.result) || dateFromFilename(file.name);
      var img = new Image();
      img.onerror = function(){ reject(new Error('decode')); };
      img.onload = function(){
        try {
          var MAX = 1600;
          var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          var scale = Math.min(1, MAX / Math.max(w, h));
          var nw = Math.max(1, Math.round(w * scale));
          var nh = Math.max(1, Math.round(h * scale));
          var c = document.createElement('canvas');
          c.width = nw; c.height = nh;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, nw, nh);
          ctx.drawImage(img, 0, 0, nw, nh);
          var dataUrl = c.toDataURL('image/jpeg', 0.82);
          var thumbUrl = '';
          if (nw > 400 || nh > 400) {
            var tscale = Math.min(1, 400 / Math.max(nw, nh));
            var tnw = Math.max(1, Math.round(nw * tscale));
            var tnh = Math.max(1, Math.round(nh * tscale));
            var tc = document.createElement('canvas');
            tc.width = tnw; tc.height = tnh;
            var tctx = tc.getContext('2d');
            tctx.fillStyle = '#FFFFFF';
            tctx.fillRect(0, 0, tnw, tnh);
            tctx.drawImage(c, 0, 0, tnw, tnh);
            thumbUrl = tc.toDataURL('image/jpeg', 0.6);
            tc.width = 0; tc.height = 0;
          }
          c.width = 0; c.height = 0;
          resolve({ dataUrl: dataUrl, thumbUrl: thumbUrl, date: exifDate });
        } catch (e) { reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  if (!IS_APP) return;
  var d = el('edDate').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('日期格式错误'); return; }
  var id = editingId;
  if (!id) {
    id = 'e' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  }
  var time = '';
  var originalImages = editingImages.slice();
  var names = editingImages.slice();
  var idx = nextNum(id, names) + 1;
  for (var i = 0; i < pendingImages.length; i++) {
    var name = id + '_' + pad2(idx++) + '.jpg';
    var b64 = pendingImages[i].dataUrl.split(',')[1] || '';
    if (b64) { try { window.Android.saveImage(name, b64); } catch(e) {} }
    var tb = pendingImages[i].thumbUrl || '';
    if (tb) {
      var tname = name.replace(/(\.\w{1,5})$/, '_t$1');
      var tb64 = tb.split(',')[1] || '';
      if (tb64) { try { window.Android.saveImage(tname, tb64); } catch(e) {} }
    }
    names.push(name);
  }
  pendingImages = [];
  var removed = originalImages.filter(function(n){ return names.indexOf(n) < 0; });
  removed.forEach(function(n){
    try { window.Android.deleteImage(n); } catch(e) {}
    try { window.Android.deleteImage(n.replace(/(\.\w{1,5})$/, '_t$1')); } catch(e) {}
  });
  var created = Date.now();
  var orig = null;
  for (var q = 0; q < entries.length; q++) if (entries[q].id === id) { orig = entries[q]; break; }
  var out = {};
  var f;
  if (orig) for (f in orig) { if (Object.prototype.hasOwnProperty.call(orig, f)) out[f] = orig[f]; }
  out.v = 1;
  out.id = id;
  out.date = d;
  out.time = time;
  out.text = el('edText').value;
  out.images = names.slice();
  out.created = created;
  var json = JSON.stringify(out);
  var ok = false;
  try { ok = window.Android.saveEntry(id, json); } catch(e) {}
  editingId = id;
  editingImages = names;
  editorDirty = false;
  if (ok) {
    toast('已保存');
    closeEditor();
    var e2 = {};
    for (f in out) { if (Object.prototype.hasOwnProperty.call(out, f)) e2[f] = out[f]; }
    e2.images = names.slice();
    var ix = -1;
    for (var k = 0; k < entries.length; k++) if (entries[k].id === id) { ix = k; break; }
    if (ix >= 0) entries[ix] = e2; else entries.push(e2);
    sortEntries();
    render();
    updateFooter();
    if (!orderSorted()) reload();
  }
  else toast('保存失败');
}
function sortEntries(){
  entries.sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (a.created || 0) - (b.created || 0);
  });
}
function orderSorted(){
  for (var i = 1; i < entries.length; i++) {
    var p = entries[i - 1], c = entries[i];
    if (p.date < c.date) return false;
    if (p.date === c.date && (p.created || 0) > (c.created || 0)) return false;
  }
  return true;
}
function deleteEntryById(id){
  var en = entries.find(function(x){ return x.id === id; });
  if (!en) return;
  if (!confirm('确定删除这条日记？其图片也会一并删除。')) return;
  en.images.forEach(function(n){
    try { window.Android.deleteImage(n); } catch(e) {}
    try { window.Android.deleteImage(n.replace(/(\.\w{1,5})$/, '_t$1')); } catch(e) {}
  });
  try { window.Android.deleteEntry(id); } catch(e) {}
  toast('已删除');
  reload();
}
function deleteDay(date){
  var list = entries.filter(function(x){ return x.date === date; });
  if (!list.length) return;
  if (!confirm('确定删除 ' + date + ' 的全部日记（共 ' + list.length + ' 条）？')) return;
  list.forEach(function(en){
    en.images.forEach(function(n){
      try { window.Android.deleteImage(n); } catch(e) {}
      try { window.Android.deleteImage(n.replace(/(\.\w{1,5})$/, '_t$1')); } catch(e) {}
    });
    try { window.Android.deleteEntry(en.id); } catch(e) {}
  });
  toast('已删除');
  reload();
}

function openLightbox(name){
  var lb = el('lightbox');
  lb.innerHTML = '<img src="' + imgSrc(name) + '">';
  lb.classList.add('open');
}
function closeLightbox(){
  var lb = el('lightbox');
  lb.classList.remove('open');
  lb.innerHTML = '';
}
function openViewer(id){
  var en = entries.find(function(x){ return x.id === id; });
  if (!en) return;
  var textHtml = escapeHtml(en.text).replace(/\n/g, '<br>');
  var imgs = '';
  for (var i = 0; i < en.images.length; i++) {
    imgs += '<img src="' + imgSrc(en.images[i]) + '" alt="" loading="lazy" onclick="openLightbox(\'' + en.images[i] + '\')">';
  }
  var v = el('viewer');
  v.innerHTML = '<div class="vwrap">' +
    '<div class="vbar">' +
      '<button class="icobtn" onclick="closeViewer()" title="返回">✕</button>' +
      '<span class="vt">' + formatDayLabel(en.date) + '</span>' +
      '<span class="vsub">' + en.date + '</span>' +
      '<button class="icobtn needapp" onclick="closeViewer();openEditorById(\'' + en.id + '\')" title="编辑">✎</button>' +
      '<button class="icobtn needapp" onclick="closeViewer();deleteEntryById(\'' + en.id + '\')" title="删除">🗑</button>' +
    '</div>' +
    '<div class="vscroll">' +
      (en.text ? '<div class="vtext">' + textHtml + '</div>' : '') +
      (imgs ? '<div class="vimgs">' + imgs + '</div>' : '') +
      (!en.text && !en.images.length ? '<div class="empty" style="padding:60px 0">（空日记）</div>' : '') +
    '</div>' +
  '</div>';
  v.classList.add('open');
}
function closeViewer(){
  var v = el('viewer');
  v.classList.remove('open');
  v.innerHTML = '';
}
function lbClick(ev){
  var now = Date.now();
  if (now - lbLast < 320) {
    lbLast = 0;
    var img = el('lightbox').querySelector('img');
    if (img) img.classList.toggle('zoomed');
  } else {
    lbLast = now;
    setTimeout(function(){
      if (lbLast && Date.now() - lbLast >= 340) { closeLightbox(); lbLast = 0; }
    }, 340);
  }
}

function showSheet(items){
  var s = el('sheet');
  var html = '<div class="sheetwrap">';
  for (var i = 0; i < items.length; i++) {
    html += '<button class="sheetbtn' + (items[i].danger ? ' danger' : '') + '" onclick="sheetPick(' + i + ')">' +
      '<span>' + escapeHtml(items[i].label) + '</span>' +
      (items[i].sub ? '<small>' + escapeHtml(items[i].sub) + '</small>' : '') +
      '</button>';
  }
  html += '</div>';
  s.innerHTML = html;
  window.__sheetItems = items;
  s.classList.add('open');
}
function sheetPick(i){
  var items = window.__sheetItems;
  closeSheet();
  if (items && items[i] && items[i].fn) items[i].fn();
}
function closeSheet(){
  var s = el('sheet');
  s.classList.remove('open');
  window.__sheetItems = null;
  window.__typedOkCb = null;
  var inp = document.getElementById('typedInput');
  if (inp) inp.value = '';
}
function typedConfirm(title, note, okLabel, onOk){
  var s = el('sheet');
  s.innerHTML = '<div class="sheetwrap">' +
    '<div class="sheethead">' + escapeHtml(title) + '</div>' +
    '<div class="sheetnote">' + note + '</div>' +
    '<input class="sheetinput" id="typedInput" type="text" autocomplete="off" placeholder="请在此输入确认文字">' +
    '<button class="sheetbtn danger" id="typedOk" onclick="typedOkClick()"><span>' + escapeHtml(okLabel) + '</span></button>' +
    '<button class="sheetbtn" onclick="closeSheet()"><span>取消</span></button>' +
    '</div>';
  window.__sheetItems = null;
  window.__typedOkCb = onOk;
  var input = document.getElementById('typedInput');
  var okBtn = document.getElementById('typedOk');
  okBtn.disabled = true;
  input.addEventListener('input', function(){
    var v = input.value.trim().toLowerCase();
    okBtn.disabled = !(v === '我确认' || v === 'i am sure');
  });
  s.classList.add('open');
  setTimeout(function(){ input.focus(); }, 120);
}
function typedOkClick(){
  var s = el('sheet');
  s.classList.remove('open');
  var cb = window.__typedOkCb;
  window.__typedOkCb = null;
  var inp = document.getElementById('typedInput');
  if (inp) inp.value = '';
  if (cb) cb();
}
function sheetBlank(ev){
  if (ev.target === el('sheet')) closeSheet();
}

function menuMenu(){
  var stats = { entries: entries.length, images: 0, bytes: 0 };
  if (IS_APP) {
    try { stats = JSON.parse(window.Android.getStats() || '{"entries":0,"images":0,"bytes":0}'); } catch(e) {}
  } else {
    for (var i = 0; i < entries.length; i++) stats.images += entries[i].images.length;
  }
  showSheet([
    { label: '统计信息', sub: stats.entries + ' 篇日记 · ' + stats.images + ' 张图片 · ' + fmtBytes(stats.bytes), fn: function(){} },
    { label: (theme === 'dark') ? '切换为浅色主题' : '切换为深色主题', fn: toggleTheme },
    { label: '导出备份', sub: 'zip / 网页文件夹 / 按年导出', fn: exportMenu },
    { label: '导入备份', sub: '从之前导出的 .zip 备份恢复，已有覆盖、新增加入', fn: importMenu },
    { label: '分享备份', sub: '把备份压缩包分享出去', fn: function(){ if (IS_APP) exportRange('share'); } },
    { label: '清空所有日记', sub: '删除全部内容，不可恢复', danger: true, fn: function(){
        if (!IS_APP) return;
        typedConfirm('清空所有日记', '将删除全部日记与图片，<b>不可恢复</b>。<br>请在下方输入 <b>我确认</b> 或 <b>i am sure</b> 后点击确认。', '确认清空', function(){
          try { window.Android.clearAll(); } catch(e) {}
          toast('已清空');
          reload();
        });
      } }
  ]);
}
function exportMenu(){
  showSheet([
    { label: '导出备份（.zip）', sub: '完整无损备份，解压后浏览器打开 index.html 即可浏览', fn: function(){ exportRange('zip'); } },
    { label: '导出网页文件夹', sub: '把可浏览的网站直接导出到所选文件夹', fn: function(){ exportRange('folder'); } },
    { label: '分享备份', sub: '把备份压缩包分享出去', fn: function(){ exportRange('share'); } }
  ]);
}
function exportRange(mode){
  var years = [];
  var seen = {};
  for (var i = 0; i < entries.length; i++) {
    var y = entries[i].date.slice(0, 4);
    if (!seen[y]) { seen[y] = 1; years.push(y); }
  }
  years.sort();
  years.reverse();
  var items = [{ label: '全部数据', sub: '导出所有年份', fn: function(){ doExport(mode, 'all'); } }];
  for (var j = 0; j < years.length; j++) {
    (function(y){
      items.push({ label: y + ' 年', sub: '', fn: function(){ doExport(mode, y); } });
    })(years[j]);
  }
  showSheet(items);
}
function doExport(mode, year){
  if (!IS_APP) return;
  if (mode === 'zip') window.Android.exportZip(year);
  else if (mode === 'folder') window.Android.exportFolder(year);
  else window.Android.shareZip(year);
}
function importMenu(){
  if (!confirm('导入将合并数据：已有日记（相同 id）会被覆盖，其余新增。\n请选择之前导出的 .zip 备份。')) return;
  window.Android.importData();
}

function reload(){ loadEntries(); render(); updateFooter(); }

function toast(msg){
  var t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

window.__handleBack = function(){
  if (el('lightbox').classList.contains('open')) { closeLightbox(); return true; }
  if (el('viewer').classList.contains('open')) { closeViewer(); return true; }
  if (el('sheet').classList.contains('open')) { closeSheet(); return true; }
  if (el('editor').classList.contains('open')) return closeEditor();
  return false;
};
window.__onExportResult = function(ok){ toast(ok ? '导出完成' : '导出失败'); };
window.__onImportResult = function(ok, count){
  if (ok) { reload(); toast('导入完成，共 ' + count + ' 篇'); }
  else toast('导入失败');
};

el('fileInput').addEventListener('change', function(ev){
  onPickFiles(ev.target.files);
  ev.target.value = '';
});
el('edText').addEventListener('input', function(){ editorDirty = true; });
el('edDate').addEventListener('change', function(){
  dateAutoSet = true;
  applyEditorDate(el('edDate').value);
});
el('sheet').addEventListener('click', sheetBlank);

initTheme();
var savedView = null;
try { savedView = localStorage.getItem('myday-view'); } catch(e) {}
if (savedView === 'timeline' || savedView === 'day' || savedView === 'month' || savedView === 'year') view = savedView;
if (!IS_APP) document.body.classList.add('browser');
updateViewTabs();
loadEntries();
render();
updateFooter();
</script>
</body>
